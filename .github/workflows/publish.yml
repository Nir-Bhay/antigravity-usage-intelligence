name: Publish Extension

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Prepublish Verification
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-git-tag-version

      - name: Find Packaged VSIX
        id: find_vsix
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "vsix_file=${VSIX_FILE}" >> $GITHUB_OUTPUT
          echo "Found VSIX package: ${VSIX_FILE}"

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "Publishing ${{ steps.find_vsix.outputs.vsix_file }} to Open VSX..."
          npx --yes ovsx publish "${{ steps.find_vsix.outputs.vsix_file }}" -p "${{ secrets.OVSX_PAT }}"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          echo "Publishing ${{ steps.find_vsix.outputs.vsix_file }} to Visual Studio Marketplace..."
          npx --yes @vscode/vsce publish --packagePath "${{ steps.find_vsix.outputs.vsix_file }}" -p "${{ secrets.VSCE_PAT }}"

      - name: Upload VSIX to Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_vsix.outputs.vsix_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
