name: CI & Extension Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Validate & Package Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 20.x ]
        python-version: [ '3.11' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax Check Python Collector
        run: python -m py_compile collector.py

      - name: Syntax Check Extension Backend
        run: |
          node -c extension.js
          node -c src/quota_detector.js

      - name: Validate Dashboard HTML Scripts
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('src/ui/dashboard.html', 'utf8');
          const scripts = html.match(/<script[\s\S]*?>([\s\S]*?)<\/script>/gi) || [];
          scripts.forEach((s, idx) => {
            const code = s.replace(/<script[\s\S]*?>/i, '').replace(/<\/script>/i, '');
            new Function(code);
          });
          console.log('Dashboard HTML scripts validated successfully.');
          "

      - name: Package VSIX Extension
        run: npx --yes @vscode/vsce package --no-git-tag-version
